[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "xinterp"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = ["numpy"]

[dependency-groups]
dev = [
    "maturin>=1.4,<2.0",
    "pytest>=7",
]

[tool.uv]
# Rebuild the extension when a Rust source, the crate manifest or the lock file
# changes; without this uv reuses a stale wheel after cargo-level edits.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "xinterp.rust"
