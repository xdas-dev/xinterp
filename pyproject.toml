[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "xinterp"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = ["numpy"]

[dependency-groups]
dev = [
    "maturin>=1.4,<2.0",
    "pytest>=7",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.uv]
# Rebuild the extension when a Rust source, the crate manifest or the lock file
# changes; without this uv reuses a stale wheel after cargo-level edits.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "xinterp.rust"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
]

[tool.pytest.ini_options]
addopts = "--cov=xinterp --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["xinterp"]
omit = ["xinterp/rust*"]
