[package]
name = "xinterp"
version = "0.2.0"
edition = "2021"
description = "Exact index-to-value interpolation, backed by a Rust extension"
license = "GPL-3.0-or-later"
repository = "https://github.com/xdas-dev/xinterp"
readme = "README.md"
keywords = ["interpolation", "datetime64", "sampling"]
categories = ["science", "mathematics"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "xinterp"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
